<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 1rem;
            font-family: Helvetica, Arial, sans-serif;
            font-weight: bold;
            color: white;
        }

        .container {
            height: calc(100vh - 2rem);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header,
        main,
        aside,
        footer {
            border-radius: 0.5rem;
            padding: 1.5rem 2rem;
        }

        header {
            background: #1e90ff;
            box-shadow: 0 4px 0 #0077ea;
        }

        footer {
            background: #4169e1;
            box-shadow: 0 4px 0 #1d44b8;
        }

        .middle {
            flex-grow: 1;
            display: flex;
            flex-direction: row;
            gap: 1rem;
        }

        main {
            flex: 3 1 0;
            background: #3cb371;
            box-shadow: 0 4px 0 #2f8d59;
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 1rem;
        }

        main > h2 {
            width: 100%;
            margin: 0;
            font-size: 1rem;
        }

        .item {
            width: 100px;
            height: 100px;
            border-radius: 0.5rem;
            background: #2f8d59;
            box-shadow: 0 4px 0 #226741;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        aside {
            flex: 1 1 0;
            background: #ff6347;
            box-shadow: 0 4px 0 #e02200;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>header</header>
        <div class="middle">
            <main>
                <h2>main</h2>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
                <div class="item">item</div>
            </main>
            <aside>sidebar</aside>
        </div>
        <footer>footer</footer>
    </div>
</body>
</html>
